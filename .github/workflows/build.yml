name: Build plugin

# Builds the Letterbox plugin and publishes a Jellyfin plugin repository:
#   https://github.com/fahadhossainzzz/jellyfin-plugin-letterbox/releases/download/repo/manifest.json
# Add that URL in Jellyfin: Dashboard > Plugins > Manage Repositories.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_ABI: "12.2.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        id: build
        run: |
          set -o pipefail
          VERSION="1.0.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet publish src/Jellyfin.Plugin.Letterbox.csproj -c Release -o out \
            -p:Version=$VERSION -p:AssemblyVersion=$VERSION -p:FileVersion=$VERSION 2>&1 | tee build.log
          ls -la out

      - name: Package and write manifest
        run: |
          ZIP="letterbox_${VERSION}.zip"
          (cd out && zip -j "../$ZIP" Jellyfin.Plugin.Letterbox.dll)
          MD5=$(md5sum "$ZIP" | cut -d' ' -f1)
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ZIP}"
          cat > manifest.json <<JSON
          [
            {
              "guid": "6b1c3a52-7f4e-4d0b-9a61-2f0f8c5e9b17",
              "name": "Letterbox",
              "overview": "Detects black bars baked into videos and tags items bars:<ratio>.",
              "description": "Samples frames from each movie and episode (read-only), measures baked-in letterbox bars and tags the item bars:<ratio> so Wholphin NoBars can fill the screen without stretching.",
              "owner": "fahadhossainzzz",
              "category": "General",
              "versions": [
                {
                  "version": "${VERSION}",
                  "changelog": "Build ${GITHUB_SHA::8}",
                  "targetAbi": "${TARGET_ABI}",
                  "sourceUrl": "${URL}",
                  "checksum": "${MD5}",
                  "timestamp": "${TS}"
                }
              ]
            }
          ]
          JSON
          python3 -m json.tool manifest.json > /dev/null
          cat manifest.json
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish release and repository manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" "$ZIP" --title "Letterbox ${VERSION}" --notes "Build ${GITHUB_SHA::8} for Jellyfin ${TARGET_ABI}" --target "$GITHUB_SHA"
          gh release view repo >/dev/null 2>&1 || gh release create repo --title "Plugin repository" --notes "Jellyfin repository URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/repo/manifest.json" --target "$GITHUB_SHA"
          gh release upload repo manifest.json --clobber

      - name: Publish build log (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f build.log || echo "no build log" > build.log
          gh release view build-log >/dev/null 2>&1 || gh release create build-log --prerelease --title "Last failed build log" --notes "Latest failed build log" --target "$GITHUB_SHA"
          gh release upload build-log build.log --clobber
